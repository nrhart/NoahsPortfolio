<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Movement — Interactive Demo | Noah Hart</title>
  <link rel="stylesheet" href="../../css/styles.css?v=ai-demo-1">
  <style>
    body { padding: 1.5rem; }
    main { max-width: 1100px; margin: auto; position: relative; z-index: 1; }
    h1 { margin: 0.75rem 0; }
    .demo-toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1rem 0; }
    .demo-help { color: var(--text-secondary); line-height: 1.7; }
    #canvas { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; background: white; border-radius: 10px; outline-offset: 4px; }
    #canvas:fullscreen { width: 100%; height: 100%; object-fit: contain; background: white; }
    #status { margin: 0.75rem 0; color: var(--accent-bright); }
    #demo-error { color: var(--text-primary); }
    .demo-toolbar button[aria-pressed="true"] { border-color: var(--accent-bright); color: var(--accent-bright); }
    @media(max-width:600px) { body { padding: 1rem; } .demo-toolbar .btn { padding: 0.6rem 0.8rem; } }
  </style>
</head>
<body>
<main>
  <a href="../../projects/ai.html#ai-movement" class="btn btn-ghost">← AI Projects</a>
  <h1>AI Movement</h1>
  <p class="demo-help">A browser build of my original openFrameworks C++ project. Explore kinematic movement, seek, wander, and flocking.</p>
  <div class="demo-toolbar" aria-label="Movement mode">
    <button class="btn btn-ghost" data-key="1" aria-pressed="false">1 · Kinematic</button>
    <button class="btn btn-ghost" data-key="2" aria-pressed="false">2 · Seek</button>
    <button class="btn btn-ghost" data-key="3" aria-pressed="false">3 · Wander</button>
    <button class="btn btn-ghost" data-key="4" aria-pressed="true">4 · Flocking</button>
  </div>
  <div class="demo-toolbar" aria-label="Demo controls">
    <button class="btn btn-ghost" data-key="b">Breadcrumbs</button>
    <button class="btn btn-ghost" data-key="d">Wander Debug</button>
    <button class="btn btn-ghost" data-key="+">Add Boid</button>
    <button class="btn btn-ghost" data-key="-">Remove Boid</button>
    <button class="btn btn-primary" id="fullscreen">Fullscreen ↗</button>
  </div>
  <p class="demo-help">Choose Seek and click or tap inside the simulation to set a target. Click the canvas to use keyboard controls.</p>
  <p id="status" role="status">Preparing browser runtime…</p>
  <p id="demo-error" hidden></p>
  <canvas id="canvas" width="1024" height="768" tabindex="0" aria-label="Interactive AI movement simulation"></canvas>
</main>
<script src="demo.js"></script>
</body>
</html>
